<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="src/styles/index.css">
    <script src="./widget.min.js"></script>
  </head>
<body style="margin:0; padding: 0;">

<!-- Widget container -->
<div class="test-container" style="position: relative !important;">
  <img width="inherit" style="width: 100%;" src="https://cdn.prod.website-files.com/6846900d35050ebd989ab0ea/69cbbdab98fbef52a5ef3869_Skjermbilde%202026-03-31%20kl.%2014.24.07.png" alt="MAD" />
  <div id="mad-book-demo-widget"></div>
</div>

<style>
  .test-container { 
    width: 70%;
    &:hover {
      cursor: pointer;
      img {
        /* Simple blur effect */
        filter: blur(10px);
      }
    }
  }
</style>

<script>
  window.onload = () => {
    window.MAD_BOOK_DEMO_WIDGET({
      targetId: 'mad-book-demo-widget',
      containerStyle: {
        zIndex: 900,
        position: 'absolute',
        inset: 0,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
      },
      triggerStyle: {
        backgroundColor: 'var(--dark)',
        color: 'var(--text-color-reverse)',
        border: 'none',
        cursor: 'pointer',
        paddingTop: 0,
        minHeight: '40px',
        paddingInline: '32px',
        paddingBottom: '0px',
        clipPath: 'polygon(5% 0%, 95% 0%, 100% 15%, 100% 85%, 95% 100%, 5% 100%, 0% 85%, 0% 15%)',
      },
  })
}
</script>
</body>
</html>

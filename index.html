<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="src/styles/index.css">
    <script src="./widget.min.js"></script>
  </head>
<body style="margin:0; padding: 0;">

<!-- Widget container -->
<div class="test-container" style="position: relative !important;">
  <img width="inherit" style="width: 100%;" src="https://cdn.prod.website-files.com/6846900d35050ebd989ab0ea/69cbbdab98fbef52a5ef3869_Skjermbilde%202026-03-31%20kl.%2014.24.07.png" alt="MAD" />
  <div id="mad-book-demo-widget"></div>
</div>

<style>
  .test-container {
    width: 70%;
    &:hover {
      cursor: pointer;
      img {
        /* Simple blur effect */
        filter: blur(2px);
      }
    }
  }
</style>

<script>
  window.onload = () => {
    window.MAD_BOOK_DEMO_WIDGET({
      targetId: 'mad-book-demo-widget',
      env: 'dev',
      videoLink: 'https://youtu.be/NpfceNJgThc',
      containerStyle: {
        zIndex: 900,
        position: 'absolute',
        inset: 0,
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
      },
      triggerStyle: {
        backgroundColor: 'var(--dark)',
        color: 'var(--text-color-reverse)',
        border: 'none',
        cursor: 'pointer',
        paddingTop: 0,
        minHeight: '40px',
        paddingInline: '32px',
        paddingBottom: '0px',
        clipPath: 'var(--clip-path-default)',
      },
      cssVars: {
        primary: '#00c0b5',
        danger: '#ff6172',
        dark: '#3c3c3c',
        warning: '#ffb637',

        borderColor: '#E5E5E5',

        bgDefault: '#fafaf6',
        bgAccent: "white",

        textColorDefault: '#333',
        textColorReverse: '#fff',
        textColorPlaceholder: '#6B7280',

        fontTitle: '"Open Sans Condensed", sans-serif',
        fontDefault: '"Open Sans", sans-serif',
        fontDemoButton: 'inherit',

        fontSizeDefault: '15px',
        fontSizeTitle: '24px',
        fontSizeSubtitle: '18px',
        fontSizeControls: '18px',
        fontSizeCaption: '15px',

        lineHeightDefault: '20px',
        lineHeightTitle: '32px',
        lineHeightSubtitle: '24px',
        lineHeightControls: '18px',
        lineHeightCaption: '20px',

        borderRadiusDefault: '12px',
        borderRadiusXl: '24px',
        borderRadiusMd: '8px',
        borderRadiusSm: '4px',

        clipPathDefault: 'polygon(5% 0%, 95% 0%, 100% 15%, 100% 85%, 95% 100%, 5% 100%, 0% 85%, 0% 15%)',
      },
      t: {
        triggerButton: 'Se demo',
        modal: {
          modalTitle: 'Se demo video',
          closeButton: 'Lukk',
          submitButton: 'Se demo',
          roles: [['owner', 'Eier'], ['manager', 'Manager'], ['employee', 'Ansatt']],
          form: {
            emailLabel: 'E-post',
            emailPlaceholder: 'Din e-post',
            nameLabel: 'Salong',
            namePlaceholder: 'Navn på salong',
            roleLabel: 'Rolle',
            rolePlaceholder: 'Hva beskriver deg best?',
          },
          formErrors: {
            emailRequired: 'E-post er påkrevet',
            emailInvalid: 'E-posten er ugyldig',
            nameRequired: 'Navn er påkrevd',
            roleRequired: 'Rolle er påkrevd',
            // companyNameRequired: 'Firmanavn er påkrevd'
          },
          successMessage: 'Demovideo sendt!',
          errorMessage: 'Kunne ikke sende demovideo. Vennligst prøv igjen.'
        }
      }
    });
  }
</script>
</body>
</html>
